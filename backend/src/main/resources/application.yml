server:
  port: 8080
  # 终端可改为本机端口；前端打包后由本服务一并托管
spring:
  application:
    name: invmap-backend
  web:
    resources:
      static-locations: classpath:/static/

invmap:
  # 配置持久化文件（park/roads）。终端本地可写目录。
  config-file: ${INVMAP_CONFIG_FILE:./data/park-config.json}
  # 跨域允许来源（前端开发服务器）。生产由后端同源托管可留空。
  cors-allowed-origins: "*"
