server:
  port: 8080
spring:
  application:
    name: invmap-backend
  web:
    resources:
      static-locations: classpath:/static/

invmap:
  config-file: ${INVMAP_CONFIG_FILE:./data/park-config.json}
  cors-allowed-origins: "*"

  # 接口鉴权（API-Key / Token）。终端在请求头携带；前端用 VITE_API_KEY 注入。
  auth:
    enabled: ${INVMAP_AUTH_ENABLED:false}
    header: ${INVMAP_AUTH_HEADER:X-Api-Key}
    api-key: ${INVMAP_API_KEY:change-me-dev-key}

  # ERP 数据源：mock(内置演示) | http(对接真实 ERP)
  erp:
    mode: ${INVMAP_ERP_MODE:mock}
    base-url: ${INVMAP_ERP_BASEURL:http://erp.example.com}
    orders-path: ${INVMAP_ERP_ORDERS_PATH:/open/pickup/orders}
    settlement-path: ${INVMAP_ERP_SETTLEMENT_PATH:/open/settlement}
    trip-path: ${INVMAP_ERP_TRIP_PATH:/open/settlement/trip}
    writeoff-path: ${INVMAP_ERP_WRITEOFF_PATH:/open/print-log}
    # 认证头（如 Authorization: Bearer xxx 或 X-Api-Key: xxx）
    auth-header: ${INVMAP_ERP_AUTH_HEADER:Authorization}
    auth-token: ${INVMAP_ERP_AUTH_TOKEN:}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
