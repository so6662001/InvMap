<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>提货导航 · 司机登录</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="login-bg">
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">InvMap</div>
      <div class="brand-sub">钢铁现货仓库 · 提货导航</div>
    </div>
    <h1>请输入提货手机号</h1>
    <p class="hint">输入预约登记的手机号，即可查看名下全部待提提单</p>

    <input id="phone" class="phone-input" type="tel" maxlength="11" inputmode="numeric"
           placeholder="11 位手机号" autocomplete="off" />
    <div id="err" class="err"></div>

    <div class="keypad" id="keypad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button data-act="clear">清空</button><button>0</button><button data-act="back">⌫</button>
    </div>

    <button id="loginBtn" class="primary-btn">查询我的提货单</button>

    <div class="demo">
      <span>演示手机号（点击填入）：</span>
      <button class="demo-phone" data-p="13800000000">13800000000 · 多库多单</button>
      <button class="demo-phone" data-p="13900000000">13900000000 · 单库单单</button>
      <button class="demo-phone" data-p="13700000000">13700000000 · 含冻结单</button>
    </div>
  </div>

  <script type="module">
    import { fetchOrders } from './js/mockErp.js';
    const phoneEl = document.getElementById('phone');
    const errEl = document.getElementById('err');

    document.getElementById('keypad').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const act = b.dataset.act;
      if (act === 'clear') phoneEl.value = '';
      else if (act === 'back') phoneEl.value = phoneEl.value.slice(0, -1);
      else if (phoneEl.value.length < 11) phoneEl.value += b.textContent;
    });
    document.querySelectorAll('.demo-phone').forEach((b) =>
      b.addEventListener('click', () => { phoneEl.value = b.dataset.p; errEl.textContent = ''; }));

    async function login() {
      const phone = phoneEl.value.trim();
      errEl.textContent = '';
      if (!/^1\d{10}$/.test(phone)) { errEl.textContent = '请输入正确的 11 位手机号'; return; }
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = '查询中…';
      const res = await fetchOrders(phone);
      btn.disabled = false; btn.textContent = '查询我的提货单';
      if (res.code !== 0) { errEl.textContent = '未查询到名下提单，请核对预约手机号或联系客服'; return; }
      sessionStorage.setItem('invmap_phone', phone);
      location.href = './app.html';
    }
    document.getElementById('loginBtn').addEventListener('click', login);
    phoneEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
